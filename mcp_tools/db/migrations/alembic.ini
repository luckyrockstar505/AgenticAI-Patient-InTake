# Alembic configuration for claims-intake-agent.
# DATABASE_URL is read from the environment in env.py — the sqlalchemy.url
# entry below is intentionally left empty and overridden at runtime.

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is populated from env var DATABASE_URL in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
