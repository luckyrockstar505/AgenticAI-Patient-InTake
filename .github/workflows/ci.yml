name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Lint (ruff + mypy)
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

  # -------------------------------------------------------------------------
  # Job 2: Unit tests
  # -------------------------------------------------------------------------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: pytest unit
        run: uv run pytest tests/unit -v

  # -------------------------------------------------------------------------
  # Job 3: Integration + contract tests (needs Postgres)
  # -------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      DATABASE_URL: postgresql+psycopg://claims:claims@localhost:5432/claims
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Run Alembic migrations
        run: uv run alembic -c mcp_tools/db/migrations/alembic.ini upgrade head

      - name: pytest integration + contracts
        run: uv run pytest tests/integration tests/contracts -v

  # -------------------------------------------------------------------------
  # Job 4: Docker build (both images, no push)
  # -------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Job 5: Eval (mock mode)
  # -------------------------------------------------------------------------
  eval:
    name: Eval (mock)
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Run evals
        run: uv run python -m evals.runner
